<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Symptom Tracker</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --sage: #4A6652;
    --sage-light: #6a8f72;
    --sage-pale: #e8f0ea;
    --sage-mid: #c5d9c9;
    --cream: #faf8f4;
    --text: #2a2a2a;
    --text-muted: #7a7a7a;
    --white: #ffffff;
    --border: #dde8df;
    /* calm green severity gradient — no reds or amber anywhere */
    --severe:      #6aa84f;
    --severe-bg:   #daefd0;
    --moderate:    #93c47d;
    --moderate-bg: #e4f2dc;
    --mild:        #c5e0bb;
    --mild-bg:     #eef7ea;
    --none-bg: #f4efe6;
    --radius: 18px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  body {
    font-family: 'Outfit', sans-serif;
    background: var(--cream);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 20px 16px 80px;
  }
  header { text-align: center; margin-bottom: 14px; }
  header h1 { font-family: 'Playfair Display', serif; font-size: 1.75rem; color: var(--sage); }
  header p { font-size: 0.82rem; color: var(--text-muted); margin-top: 4px; font-weight: 300; }
  #chat-wrap { width: 100%; max-width: 480px; display: flex; flex-direction: column; }

  /* --- daily quote card --- */
  #quote-card {
    background: var(--white); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 16px 18px 14px;
    margin-bottom: 14px; text-align: center;
  }
  #quote-text {
    font-family: 'Playfair Display', serif; font-style: italic;
    font-size: 0.9rem; color: var(--text); line-height: 1.65;
    margin-bottom: 8px;
  }
  #quote-attr {
    font-family: 'Outfit', sans-serif; font-size: 0.68rem;
    text-transform: uppercase; letter-spacing: 0.08em;
    color: var(--text-muted); font-weight: 500;
  }

  /* --- stats strip (streak + month progress) --- */
  #stats-strip {
    display: flex; gap: 10px; margin-bottom: 14px;
  }
  .stat-card {
    flex: 1; background: var(--white); border: 1px solid var(--border);
    border-radius: 14px; padding: 10px 12px;
    display: flex; flex-direction: column; gap: 4px;
  }
  .stat-label {
    font-size: 0.68rem; text-transform: uppercase; letter-spacing: 0.06em;
    color: var(--text-muted); font-weight: 500;
  }
  .stat-value {
    font-family: 'Playfair Display', serif; font-size: 1.15rem;
    color: var(--sage); display: flex; align-items: center; gap: 6px;
  }
  .stat-value .flame { font-size: 1.05rem; }
  .month-bar {
    height: 4px; background: var(--sage-pale); border-radius: 999px;
    overflow: hidden; margin-top: 4px;
  }
  .month-bar-fill {
    height: 100%; background: var(--sage); border-radius: 999px;
    transition: width 0.5s ease; width: 0%;
  }

  /* --- missed-day banner --- */
  #missed-banner {
    display: none; background: var(--white); border: 1px solid var(--sage-mid);
    border-radius: 14px; padding: 12px 14px; margin-bottom: 14px;
    box-shadow: 0 2px 12px rgba(74,102,82,0.05);
  }
  #missed-banner p {
    font-size: 0.86rem; color: var(--text); margin-bottom: 10px; line-height: 1.4;
  }
  #missed-banner .banner-actions { display: flex; gap: 8px; }
  .mini-btn {
    flex: 1; padding: 9px 8px; border-radius: 10px; border: 1.5px solid var(--border);
    background: var(--white); font-family: 'Outfit', sans-serif; font-size: 0.82rem;
    font-weight: 500; color: var(--text); cursor: pointer; transition: all 0.15s ease;
    -webkit-appearance: none;
  }
  .mini-btn.primary { border-color: var(--sage); color: var(--sage); }
  .mini-btn.primary:active { background: var(--sage-pale); }
  .mini-btn.ghost { color: var(--text-muted); }
  .mini-btn.ghost:active { background: #f0f0f0; }

  /* --- question progress --- */
  #q-progress-wrap {
    width: 100%; background: var(--border); border-radius: 999px;
    height: 4px; margin-bottom: 18px; overflow: hidden;
  }
  #q-progress {
    height: 100%; background: var(--sage); border-radius: 999px;
    transition: width 0.5s ease; width: 0%;
  }

  #messages { display: flex; flex-direction: column; gap: 10px; margin-bottom: 16px; }
  .msg { display: flex; gap: 10px; align-items: flex-end; animation: fadeUp 0.22s ease; }
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(6px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  .msg.assistant { flex-direction: row; }
  .msg.user      { flex-direction: row-reverse; }
  .avatar {
    width: 28px; height: 28px; border-radius: 50%; background: var(--sage);
    display: flex; align-items: center; justify-content: center;
    font-size: 0.7rem; color: white; flex-shrink: 0;
    font-family: 'Playfair Display', serif; font-style: italic;
  }
  .bubble { max-width: 82%; padding: 10px 14px; border-radius: 16px; font-size: 0.9rem; line-height: 1.5; }
  .msg.assistant .bubble { background: var(--white); border: 1px solid var(--border); border-bottom-left-radius: 4px; color: var(--text); }
  .msg.user .bubble { background: var(--sage); color: white; border-bottom-right-radius: 4px; }
  .bubble.typing span {
    display: inline-block; width: 6px; height: 6px; background: var(--sage-mid);
    border-radius: 50%; animation: blink 1.2s infinite; margin: 0 2px;
  }
  .bubble.typing span:nth-child(2) { animation-delay: 0.2s; }
  .bubble.typing span:nth-child(3) { animation-delay: 0.4s; }
  @keyframes blink {
    0%,80%,100% { opacity:0.2; transform:scale(0.8); }
    40%          { opacity:1;   transform:scale(1); }
  }
  #btn-area { display: flex; flex-direction: column; gap: 8px; margin-bottom: 8px; }
  .btn-row { display: flex; gap: 8px; }
  .choice-btn {
    flex: 1; padding: 14px 8px; border-radius: 14px; border: 2px solid var(--border);
    background: var(--white); font-family: 'Outfit', sans-serif; font-size: 0.9rem;
    font-weight: 500; color: var(--text); cursor: pointer; transition: all 0.15s ease;
    text-align: center; -webkit-appearance: none;
  }
  .choice-btn:active { transform: scale(0.95); }
  .choice-btn.no       { border-color: #ccc; color: #888; }
  .choice-btn.no:active { background: #f0f0f0; border-color: #aaa; }
  .choice-btn.mild     { border-color: var(--mild); color: var(--sage); }
  .choice-btn.mild:active { background: var(--mild-bg); }
  .choice-btn.moderate { border-color: var(--moderate); color: var(--sage); }
  .choice-btn.moderate:active { background: var(--moderate-bg); }
  .choice-btn.severe   { border-color: var(--severe); color: var(--severe); }
  .choice-btn.severe:active { background: var(--severe-bg); }
  .choice-btn.normal   { border-color: var(--sage); color: var(--sage); }
  .choice-btn.normal:active { background: var(--sage-pale); }
  .choice-btn.abnormal { border-color: var(--moderate); color: var(--sage); }
  .choice-btn.abnormal:active { background: var(--moderate-bg); }

  /* mood buttons — 7-step scale matching the sheet (green gradient, no warm colours) */
  .choice-btn.mood-numb        { border-color: var(--severe);   color: var(--severe); }
  .choice-btn.mood-numb:active { background: var(--severe-bg); }
  .choice-btn.mood-rock-bottom { border-color: var(--severe);   color: var(--severe); }
  .choice-btn.mood-rock-bottom:active { background: var(--severe-bg); }
  .choice-btn.mood-irritable   { border-color: var(--moderate); color: var(--sage); }
  .choice-btn.mood-irritable:active { background: var(--moderate-bg); }
  .choice-btn.mood-sad         { border-color: var(--moderate); color: var(--sage); }
  .choice-btn.mood-sad:active  { background: var(--moderate-bg); }
  .choice-btn.mood-anxious     { border-color: var(--sage-mid); color: var(--sage); }
  .choice-btn.mood-anxious:active { background: var(--sage-pale); }
  .choice-btn.mood-okay        { border-color: var(--mild); color: var(--sage); }
  .choice-btn.mood-okay:active { background: var(--mild-bg); }
  .choice-btn.mood-happy       { border-color: var(--sage); color: var(--sage); }
  .choice-btn.mood-happy:active { background: var(--sage-pale); }

  /* free-text note area */
  .note-wrap { display: flex; flex-direction: column; gap: 8px; }
  .note-input {
    width: 100%; padding: 12px 14px; border-radius: 14px;
    border: 2px solid var(--border); background: var(--white);
    font-family: 'Outfit', sans-serif; font-size: 0.9rem; color: var(--text);
    resize: none; line-height: 1.5; -webkit-appearance: none;
    outline: none;
  }
  .note-input:focus { border-color: var(--sage-mid); }
  .note-submit {
    align-self: flex-end; padding: 11px 22px; border-radius: 12px;
    border: none; background: var(--sage); color: white;
    font-family: 'Outfit', sans-serif; font-size: 0.88rem; font-weight: 500;
    cursor: pointer; -webkit-appearance: none;
  }
  .note-submit:active { opacity: 0.85; }
  .note-skip {
    align-self: flex-end; padding: 11px 16px; border-radius: 12px;
    border: 1.5px solid var(--border); background: var(--white); color: var(--text-muted);
    font-family: 'Outfit', sans-serif; font-size: 0.88rem; font-weight: 500;
    cursor: pointer; -webkit-appearance: none; margin-right: 8px;
  }
  .note-skip:active { background: #f0f0f0; }
  .note-actions { display: flex; justify-content: flex-end; }

  /* --- yesterday-mode banner --- */
  #date-context {
    display: none; background: var(--sage-pale); border: 1px solid var(--sage-mid);
    color: var(--sage); border-radius: 10px; padding: 8px 12px;
    font-size: 0.78rem; text-align: center; margin-bottom: 10px; font-weight: 500;
  }

  #summary-card {
    display: none; background: var(--white); border-radius: var(--radius);
    border: 1px solid var(--border); padding: 20px; margin-top: 10px;
    box-shadow: 0 2px 16px rgba(74,102,82,0.07);
  }
  #summary-card h2 { font-family: 'Playfair Display', serif; font-size: 1rem; color: var(--sage); margin-bottom: 14px; }
  .s-row {
    display: flex; justify-content: space-between; align-items: center;
    padding: 8px 0; border-bottom: 1px solid var(--sage-pale); font-size: 0.83rem;
  }
  .s-row:last-child { border-bottom: none; }
  .s-name { color: var(--text-muted); }
  .badge { padding: 3px 11px; border-radius: 20px; font-size: 0.74rem; font-weight: 600; }
  .b-severe   { background: var(--severe-bg);   color: var(--severe); }
  .b-moderate { background: var(--moderate-bg); color: var(--sage); }
  .b-mild     { background: var(--mild-bg);     color: var(--sage); }
  .b-normal   { background: var(--sage-pale);   color: var(--sage); }
  .b-no       { background: #f0f0f0; color: #999; }
  .b-mood     { background: var(--sage-pale); color: var(--sage); font-style: italic; }

  #save-status {
    display: none; margin-top: 12px; padding: 12px 16px; border-radius: 12px;
    font-size: 0.82rem; text-align: center; font-weight: 500;
  }
  #save-status.saving { background: var(--sage-pale); border: 1px solid var(--sage-mid); color: var(--sage); }
  #save-status.saved  { background: var(--mild-bg); border: 1px solid var(--mild); color: var(--sage); }
  /* soft sage for errors — no reds ever */
  #save-status.error  { background: var(--sage-pale); border: 1px dashed var(--sage-mid); color: var(--text-muted); }

  /* --- heatmap --- */
  #heatmap-section {
    margin-top: 24px; background: var(--white); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 16px 16px 18px;
  }
  .section-title {
    font-family: 'Playfair Display', serif; font-size: 1rem; color: var(--sage);
    margin-bottom: 12px; display: flex; justify-content: space-between; align-items: baseline;
  }
  .section-title .sub {
    font-family: 'Outfit', sans-serif; font-size: 0.74rem; color: var(--text-muted);
    font-weight: 400; font-style: normal;
  }
  .heatmap-weekdays {
    display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px;
    margin-bottom: 6px;
  }
  .heatmap-weekdays span {
    text-align: center; font-size: 0.62rem; color: var(--text-muted);
    text-transform: uppercase; letter-spacing: 0.05em; font-weight: 500;
  }
  .heatmap-grid {
    display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px;
  }
  .heat-cell {
    aspect-ratio: 1 / 1; border-radius: 6px; background: transparent;
    display: flex; align-items: center; justify-content: center;
    font-size: 0.66rem; color: var(--text-muted); font-weight: 500;
    border: 1px solid transparent;
  }
  .heat-cell.empty { background: transparent; }
  .heat-cell.unlogged { background: #f1ece2; color: #b8a98a; }
  .heat-cell.future { background: transparent; color: #c8c2b3; opacity: 0.6; }
  .heat-cell.today { box-shadow: 0 0 0 2px var(--sage) inset; }
  /* calm green gradient — consistent with severity scale */
  .heat-cell.sev-none     { background: var(--sage-pale); color: var(--sage); }
  .heat-cell.sev-mild     { background: #c5e0bb;          color: #2d5a3a; }
  .heat-cell.sev-moderate { background: #93c47d;          color: #1a4028; }
  .heat-cell.sev-severe   { background: #6aa84f;          color: #ffffff; }
  .heatmap-legend {
    display: flex; gap: 10px; margin-top: 12px; justify-content: center;
    flex-wrap: wrap;
  }
  .legend-item {
    display: flex; align-items: center; gap: 5px;
    font-size: 0.68rem; color: var(--text-muted);
  }
  .legend-swatch {
    width: 11px; height: 11px; border-radius: 3px;
  }

  /* --- footer / calendar + reports buttons --- */
  #cal-footer {
    margin-top: 24px; text-align: center; display: flex; flex-direction: column; gap: 10px;
    align-items: center;
  }
  #cal-download, #reports-btn {
    background: none; border: 1px dashed var(--sage-mid); color: var(--sage);
    padding: 11px 18px; border-radius: 12px; font-family: 'Outfit', sans-serif;
    font-size: 0.82rem; font-weight: 500; cursor: pointer;
    transition: all 0.15s ease; -webkit-appearance: none;
  }
  #cal-download:active, #reports-btn:active { background: var(--sage-pale); }

  /* =====================================================================
     REPORTS OVERLAY
     ===================================================================== */
  #reports-overlay {
    display: none; position: fixed; inset: 0; z-index: 100;
    background: var(--cream); overflow-y: auto;
    padding: 0 0 60px; -webkit-overflow-scrolling: touch;
  }
  #reports-overlay.open { display: block; }

  #reports-topbar {
    position: sticky; top: 0; z-index: 10;
    background: var(--cream); border-bottom: 1px solid var(--border);
    padding: 14px 16px 12px;
    display: flex; align-items: center; gap: 10px;
  }
  #reports-topbar h2 {
    font-family: 'Playfair Display', serif; font-size: 1.15rem; color: var(--sage);
    flex: 1;
  }
  #reports-pdf-btn {
    background: var(--sage); color: white; border: none;
    padding: 8px 14px; border-radius: 10px; font-family: 'Outfit', sans-serif;
    font-size: 0.78rem; font-weight: 500; cursor: pointer; -webkit-appearance: none;
  }
  #reports-pdf-btn:active { opacity: 0.85; }
  #reports-close-btn {
    background: none; border: 1.5px solid var(--border); color: var(--text-muted);
    width: 32px; height: 32px; border-radius: 50%; font-size: 0.9rem;
    cursor: pointer; display: flex; align-items: center; justify-content: center;
    -webkit-appearance: none; flex-shrink: 0;
  }
  #reports-close-btn:active { background: var(--sage-pale); }

  #reports-content {
    max-width: 480px; margin: 0 auto; padding: 16px;
  }

  /* range presets */
  #range-presets {
    display: flex; flex-wrap: wrap; gap: 7px; margin-bottom: 18px;
  }
  .range-btn {
    padding: 8px 14px; border-radius: 20px; border: 1.5px solid var(--border);
    background: var(--white); font-family: 'Outfit', sans-serif; font-size: 0.78rem;
    font-weight: 500; color: var(--text-muted); cursor: pointer; -webkit-appearance: none;
    transition: all 0.15s ease;
  }
  .range-btn.active {
    border-color: var(--sage); background: var(--sage); color: white;
  }
  .range-btn:active { opacity: 0.8; }

  /* report section cards */
  .report-card {
    background: var(--white); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 16px; margin-bottom: 14px;
  }
  .report-card-title {
    font-family: 'Playfair Display', serif; font-size: 0.95rem; color: var(--sage);
    margin-bottom: 12px;
  }

  /* summary stats grid */
  .summary-grid {
    display: grid; grid-template-columns: 1fr 1fr; gap: 10px;
  }
  .summary-stat {
    background: var(--sage-pale); border-radius: 10px; padding: 10px 12px;
  }
  .summary-stat-label {
    font-size: 0.67rem; text-transform: uppercase; letter-spacing: 0.06em;
    color: var(--text-muted); font-weight: 500; margin-bottom: 4px;
  }
  .summary-stat-value {
    font-family: 'Playfair Display', serif; font-size: 1.05rem; color: var(--sage);
    line-height: 1.2;
  }
  .summary-stat-sub {
    font-size: 0.7rem; color: var(--text-muted); font-family: 'Outfit', sans-serif;
    margin-top: 2px;
  }

  /* per-symptom stacked bars */
  .symptom-bar-row {
    margin-bottom: 10px;
  }
  .symptom-bar-label {
    font-size: 0.78rem; color: var(--text); margin-bottom: 5px;
    display: flex; justify-content: space-between; align-items: center;
  }
  .symptom-bar-label .bar-worst {
    font-size: 0.68rem; color: var(--text-muted);
  }
  .symptom-bar-track {
    height: 10px; border-radius: 999px; background: var(--sage-pale);
    overflow: hidden; display: flex;
  }
  .bar-seg {
    height: 100%; transition: width 0.5s ease;
  }
  .bar-seg.seg-mild     { background: #c5e0bb; }
  .bar-seg.seg-moderate { background: #93c47d; }
  .bar-seg.seg-severe   { background: #6aa84f; }

  /* report heatmap (same visual as main heatmap) */
  .report-heatmap-year {
    margin-bottom: 16px;
  }
  .report-month-label {
    font-family: 'Outfit', sans-serif; font-size: 0.72rem; color: var(--text-muted);
    font-weight: 500; text-transform: uppercase; letter-spacing: 0.06em;
    margin-bottom: 6px;
  }
  .report-heat-weekdays {
    display: grid; grid-template-columns: repeat(7, 1fr); gap: 3px; margin-bottom: 4px;
  }
  .report-heat-weekdays span {
    text-align: center; font-size: 0.58rem; color: var(--text-muted);
    text-transform: uppercase; letter-spacing: 0.04em;
  }
  .report-heat-grid {
    display: grid; grid-template-columns: repeat(7, 1fr); gap: 3px;
  }
  .report-heat-cell {
    aspect-ratio: 1 / 1; border-radius: 4px; background: transparent;
    display: flex; align-items: center; justify-content: center;
    font-size: 0.6rem; color: var(--text-muted); font-weight: 500;
  }
  .report-heat-cell.rh-empty    { }
  .report-heat-cell.rh-future   { opacity: 0.3; }
  .report-heat-cell.rh-unlogged { background: #f1ece2; color: #b8a98a; }
  .report-heat-cell.rh-none     { background: var(--sage-pale); color: var(--sage); }
  .report-heat-cell.rh-mild     { background: #c5e0bb; color: #2d5a3a; }
  .report-heat-cell.rh-moderate { background: #93c47d; color: #1a4028; }
  .report-heat-cell.rh-severe   { background: #6aa84f; color: #ffffff; }

  /* mood strip */
  .mood-strip {
    display: flex; flex-wrap: wrap; gap: 6px;
  }
  .mood-chip {
    display: flex; align-items: center; gap: 5px;
    background: var(--sage-pale); border-radius: 20px;
    padding: 4px 10px 4px 8px; font-size: 0.72rem; color: var(--sage);
  }
  .mood-chip .mood-date { color: var(--text-muted); font-size: 0.65rem; }

  /* loading state */
  #reports-loading {
    text-align: center; padding: 40px 16px;
    font-size: 0.86rem; color: var(--text-muted);
  }

  /* AI insights card */
  .insights-trigger {
    width: 100%; padding: 13px; border-radius: 14px;
    border: 1.5px dashed var(--sage-mid); background: var(--white);
    font-family: 'Outfit', sans-serif; font-size: 0.88rem; font-weight: 500;
    color: var(--sage); cursor: pointer; -webkit-appearance: none;
    transition: all 0.15s ease;
  }
  .insights-trigger:active { background: var(--sage-pale); }
  .insights-trigger:disabled { opacity: 0.5; cursor: default; }
  .insights-dots span {
    display: inline-block; width: 6px; height: 6px; background: var(--sage-mid);
    border-radius: 50%; animation: blink 1.2s infinite; margin: 0 2px;
  }
  .insights-dots span:nth-child(2) { animation-delay: 0.2s; }
  .insights-dots span:nth-child(3) { animation-delay: 0.4s; }
  .insights-body {
    font-size: 0.86rem; line-height: 1.65; color: var(--text);
    white-space: pre-wrap;
  }
  .insights-body strong { color: var(--sage); font-weight: 600; }
  .insights-meta {
    margin-top: 10px; font-size: 0.68rem; color: var(--text-muted);
    font-style: italic;
  }

  /* =====================================================================
     PRINT STYLESHEET — only the report content prints
     ===================================================================== */
  @media print {
    body > *:not(#reports-overlay) { display: none !important; }

function dailyQuote() {
  const today = isoKey(jamaicaNow());
  let hash = 0;
  for (const ch of today) hash = ((hash * 31) + ch.charCodeAt(0)) | 0;
  return QUOTES[Math.abs(hash) % QUOTES.length];
}

function renderQuote() {
  const { q, a } = dailyQuote();
  document.getElementById('quote-text').textContent = '“' + q + '”';
  document.getElementById('quote-attr').textContent = '— ' + a;
}

/* =========================================================================
   DATE HELPERS (Jamaica timezone, no DST)
   ========================================================================= */
function jamaicaNow() {
  return new Date(new Date().toLocaleString('en-US', { timeZone: 'America/Jamaica' }));
}
function jamaicaParts(d) {
  const fmt = new Intl.DateTimeFormat('en-CA', {
    timeZone: 'America/Jamaica', year: 'numeric', month: '2-digit', day: '2-digit'
  });
  const parts = Object.fromEntries(fmt.formatToParts(d).map(p => [p.type, p.value]));
  return { y: +parts.year, m: +parts.month, d: +parts.day };
}
function isoKey(d) {
  const { y, m, d: day } = jamaicaParts(d);
  return `${y}-${String(m).padStart(2,'0')}-${String(day).padStart(2,'0')}`;
}
function isoKeyFromYMD(y, m, day) {
  return `${y}-${String(m).padStart(2,'0')}-${String(day).padStart(2,'0')}`;
}
function prettyDate(d) {
  return d.toLocaleDateString('en-GB', {
    timeZone: 'America/Jamaica', day: 'numeric', month: 'long', year: 'numeric'
  });
}
function prettyDateFromIso(iso) {
  const [y, m, d] = iso.split('-').map(Number);
  const dt = new Date(Date.UTC(y, m - 1, d, 12));
  return prettyDate(dt);
}
function daysInMonth(y, m) {
  return new Date(y, m, 0).getDate();
}

/* =========================================================================
   LOCAL HISTORY (the data backbone)
   ========================================================================= */
function loadHistory() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return { logs: {}, dismissed: {}, moods: {} };
    const parsed = JSON.parse(raw);
    return {
      logs: parsed.logs || {},
      dismissed: parsed.dismissed || {},
      moods: parsed.moods || {}
    };
  } catch (e) {
    return { logs: {}, dismissed: {}, moods: {} };
  }
}
function saveHistory(history) {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(history));
  } catch (e) { /* private mode — silently fail */ }
}
function worstSeverity(data) {
  let worst = 'none';
  const rank = { none: 0, mild: 1, moderate: 2, severe: 3 };
  for (const [k, v] of Object.entries(data)) {
    let s = 'none';
    if (v === 'Severe') s = 'severe';
    else if (v === 'Moderate') s = 'moderate';
    else if (v === 'Mild') s = 'mild';
    else if (v === 'Abnormal') s = 'moderate';
    if (rank[s] > rank[worst]) worst = s;
  }
  return worst;
}
function recordLog(iso, prettyDateStr, data) {
  const history = loadHistory();
  history.logs[iso] = {
    date: prettyDateStr,
    data: data,
    severity: worstSeverity(data),
    savedAt: new Date().toISOString()
  };
  saveHistory(history);
}
function recordMood(iso, prettyDateStr, mood, note) {
  const history = loadHistory();
  history.moods[iso] = {
    date: prettyDateStr,
    mood: mood,
    note: note || '',
    savedAt: new Date().toISOString()
  };
  saveHistory(history);
}
function computeStreak() {
  const history = loadHistory();
  const logs = history.logs;
  let streak = 0;
  const today = jamaicaNow();
  let cursor = new Date(today);
  if (!logs[isoKey(cursor)]) {
    cursor.setDate(cursor.getDate() - 1);
  }
  while (logs[isoKey(cursor)]) {
    streak++;
    cursor.setDate(cursor.getDate() - 1);
  }
  return streak;
}
function computeMonthProgress() {
  const history = loadHistory();
  const today = jamaicaNow();
  const { y, m, d } = jamaicaParts(today);
  let logged = 0;
  for (let day = 1; day <= d; day++) {
    if (history.logs[isoKeyFromYMD(y, m, day)]) logged++;
  }
  return { logged, elapsed: d, totalInMonth: daysInMonth(y, m) };
}

function renderStats() {

/* =========================================================================
   HEATMAP
   ========================================================================= */
function renderHeatmap() {
  const history = loadHistory();
  const today = jamaicaNow();
  const { y, m, d: todayDay } = jamaicaParts(today);
  const total = daysInMonth(y, m);
  const monthName = today.toLocaleDateString('en-US', { timeZone:'America/Jamaica', month: 'long' });
  document.getElementById('heatmap-month-label').textContent = monthName + ' ' + y;

  const firstOfMonth = new Date(Date.UTC(y, m - 1, 1, 12));
  const firstWeekday = firstOfMonth.getUTCDay();

  const grid = document.getElementById('heatmap-grid');
  grid.innerHTML = '';
  for (let i = 0; i < firstWeekday; i++) {
    const c = document.createElement('div');
    c.className = 'heat-cell empty';
    grid.appendChild(c);
  }
  let loggedCount = 0;
  for (let day = 1; day <= total; day++) {
    const iso = isoKeyFromYMD(y, m, day);
    const cell = document.createElement('div');
    cell.className = 'heat-cell';
    cell.textContent = day;
    cell.title = prettyDateFromIso(iso);
    if (day > todayDay) {
      cell.classList.add('future');
    } else if (history.logs[iso]) {
      loggedCount++;
      const sev = history.logs[iso].severity || 'none';
      cell.classList.add('sev-' + sev);
      const sevLabel = sev === 'none' ? 'symptom-free' : sev;
      cell.title += ' — ' + sevLabel;
    } else {
      cell.classList.add('unlogged');
    }
    if (day === todayDay) cell.classList.add('today');
    grid.appendChild(cell);
  }
  document.getElementById('heatmap-sub').textContent =
    loggedCount + ' / ' + todayDay + ' logged';
}

/* =========================================================================

function maybeShowMissedDay() {
  const history = loadHistory();
  const yesterday = new Date(jamaicaNow());
  yesterday.setDate(yesterday.getDate() - 1);
  const yIso = isoKey(yesterday);
  const todayIso = isoKey(jamaicaNow());

  if (history.logs[yIso]) return;
  if (history.dismissed[todayIso] === yIso) return;
  if (Object.keys(history.logs).length === 0) return;

  document.getElementById('missed-banner-text').textContent =
    "Looks like yesterday (" + prettyDateFromIso(yIso) + ") isn't logged yet. Want to log it now?";
  missedBanner.style.display = 'block';

    missedBanner.style.display = 'none';

  document.getElementById('missed-no').onclick = () => {
    history.dismissed[todayIso] = yIso;
    saveHistory(history);
    missedBanner.style.display = 'none';
  };
}

function pick(key, value, label) {
  if (busy) return;
  busy = true;
  collected[key] = value;
  addMsg('user', label);
  clearBtns();
  currentIdx++;
  setProgress(currentIdx);
  setTimeout(() => {
    if (currentIdx < SYMPTOMS.length) {
      askNext();
    } else {
      // symptoms done — transition to mood
      startMoodFlow();
    }
    busy = false;
  }, 350);
}

function askNext() {
  const s = SYMPTOMS[currentIdx];
  showTyping();
  setTimeout(() => {
    removeTyping();
    const q = isYesterdayMode ? QUESTIONS_Y[s.key] : QUESTIONS[s.key];
    addMsg('assistant', q);
    showButtons(s.key);
  }, 550);
}

/* =========================================================================
   MOOD SUB-FLOW (runs after all 11 symptoms)
   ========================================================================= */
function startMoodFlow() {
  moodPhase = true;
  showTyping();
  setTimeout(() => {
    removeTyping();
    const dayWord = isYesterdayMode ? "yesterday" : "today";
    addMsg('assistant', "One more — how would you describe your mood " + dayWord + "?");
    showMoodButtons();
  }, 650);
}

function pickMood(value) {
  collectedMood = value;
  addMsg('user', value);
  clearBtns();
  setProgress(SYMPTOMS.length + 1);
  showTyping();
  setTimeout(() => {
    removeTyping();
    addMsg('assistant', "Anything on your mind you'd like to note?");
    showNoteInput();
  }, 500);
}

async function finishMood(note) {
  collectedNote = note;
  if (note) addMsg('user', note);
  clearBtns();
  setProgress(SYMPTOMS.length + 2);
  showTyping();
  setTimeout(async () => {
    removeTyping();
    const issues = Object.entries(collected).filter(([k,v]) => v !== 'no' && v !== 'Normal');
    const dayWord = isYesterdayMode ? "yesterday" : "today";
    const msg = issues.length === 0
      ? "Sounds like " + (isYesterdayMode ? "yesterday was a good day" : "a good day") + "! All logged. 🌿"
      : "Got it — I've noted " + issues.map(([k]) => LABELS[k]).join(', ') + ". Take care of yourself " + dayWord + ". 💚";
    addMsg('assistant', msg);
    showSummary();
    await saveToSheets();
    await saveMoodToSheets();
  }, 650);
}

   SAVE TO SHEETS
   ========================================================================= */
async function saveToSheets() {
  saveStatus.style.display = 'block';
  saveStatus.className = 'saving';
  saveStatus.textContent = 'Saving to your sheet...';
  scrollBottom();
  try {
    const res = await fetch(WORKER_URL + '/sheets', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ date: targetPretty, data: collected }),
    });
    const result = await res.json();
    if (result.success) {
      recordLog(targetIso, targetPretty, collected);
      renderStats();
      renderHeatmap();
      saveStatus.className = 'saved';
      saveStatus.textContent = 'Saved to your sheet!';
    } else {
      throw new Error(result.error || 'Unknown error');
    }
  } catch (e) {
    recordLog(targetIso, targetPretty, collected);
    renderStats();
    renderHeatmap();
    saveStatus.className = 'error';
    saveStatus.textContent = 'Saved locally — could not reach sheet: ' + e.message;
  }
  scrollBottom();
}

async function saveMoodToSheets() {
  if (!collectedMood) return;
  // Save locally first regardless of network
  recordMood(targetIso, targetPretty, collectedMood, collectedNote);
  try {
    const res = await fetch(WORKER_URL + '/sheets', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        tab: 'Mood',
        date: targetPretty,
        data: { mood: collectedMood, note: collectedNote }
      }),
    });
    const result = await res.json();
    if (!result.success) {
      // Surface the error so we can see exactly what's failing
      saveStatus.className = 'error';
      saveStatus.textContent = 'Mood saved locally — sheet write failed: ' + (result.error || 'unknown');
    }
  } catch (e) {
    saveStatus.className = 'error';
    saveStatus.textContent = 'Mood saved locally — could not reach sheet: ' + e.message;
  }
}

function pad(n) { return String(n).padStart(2, '0'); }
function buildIcs() {
  const now = jamaicaNow();
  const start = new Date(now);
  start.setDate(start.getDate() + 1);
  const y = start.getFullYear();
  const m = pad(start.getMonth() + 1);
  const d = pad(start.getDate());
  const dtStart = `${y}${m}${d}T${pad(REMINDER_HOUR)}${pad(REMINDER_MIN)}00`;
  const dtEnd   = `${y}${m}${d}T${pad(REMINDER_HOUR)}${pad(REMINDER_MIN + 15 < 60 ? REMINDER_MIN + 15 : 59)}00`;
  const stampUtc = new Date().toISOString().replace(/[-:]/g,'').replace(/\.\d{3}/,'');
  const uid = 'endo-tracker-daily-' + Date.now() + '@jonsouthy.github.io';

  const lines = [
    'BEGIN:VCALENDAR',
    'VERSION:2.0',
    'PRODID:-//Endo Tracker//Daily Reminder//EN',
    'CALSCALE:GREGORIAN',
    'METHOD:PUBLISH',
    'BEGIN:VTIMEZONE',
    'TZID:America/Jamaica',
    'BEGIN:STANDARD',
    'DTSTART:19700101T000000',
    'TZOFFSETFROM:-0500',
    'TZOFFSETTO:-0500',
    'TZNAME:EST',
    'END:STANDARD',
    'END:VTIMEZONE',
    'BEGIN:VEVENT',
    'UID:' + uid,
    'DTSTAMP:' + stampUtc,
    'DTSTART;TZID=America/Jamaica:' + dtStart,
    'DTEND;TZID=America/Jamaica:' + dtEnd,
    'RRULE:FREQ=DAILY',
    'SUMMARY:Log today\'s symptoms 🌿',
    'DESCRIPTION:Quick check-in for the symptom tracker.\\n\\n' + TRACKER_URL,
    'URL:' + TRACKER_URL,
    'BEGIN:VALARM',
    'TRIGGER:-PT0M',
    'ACTION:DISPLAY',
    'DESCRIPTION:Log today\'s symptoms',
    'END:VALARM',
    'END:VEVENT',
    'END:VCALENDAR'
  ];
  return lines.join('\r\n');
}
function downloadIcs() {
  const blob = new Blob([buildIcs()], { type: 'text/calendar;charset=utf-8' });

// Symptom keys in display order for the bars
const SYMPTOM_KEYS_ORDERED = [
  'fatigue','pelvicPain','abdomenDiscomfort','constipation','backPain',
  'nausea','migraine','nervePain','neckShoulderPain','insomnia','appetite'
];
const SYMPTOM_LABELS_SHORT = {
  migraine: 'Migraine', nausea: 'Nausea', pelvicPain: 'Pelvic Pain',
  backPain: 'Back Pain', constipation: 'Constipation', fatigue: 'Fatigue',
  nervePain: 'Nerve Pain', insomnia: 'Insomnia', abdomenDiscomfort: 'Abdomen Discomfort',
  neckShoulderPain: 'Neck & Shoulder', appetite: 'Appetite'
};

// Build the ISO date range for a given preset
function rangeFromPreset(preset) {
  const today = isoKey(jamaicaNow());
  const { y, m } = jamaicaParts(jamaicaNow());
  let from, to;
  if (preset === 'month') {
    from = isoKeyFromYMD(y, m, 1);
    to   = today;
  } else if (preset === '30') {
    const d = jamaicaNow();
    d.setDate(d.getDate() - 29);
    from = isoKey(d);
    to   = today;
  } else if (preset === '90') {
    const d = jamaicaNow();
    d.setDate(d.getDate() - 89);
    from = isoKey(d);
    to   = today;
  } else { // 'all' — go back as far as localStorage has data
    const history = loadHistory();
    const keys = Object.keys(history.logs || {});
    from = keys.length > 0 ? keys.sort()[0] : isoKeyFromYMD(y, m, 1);
    to   = today;
  }
  return { from, to };
}

// Fetch from worker and merge into localStorage
async function fetchAndMerge(from, to) {
  try {
    const [sympRes, moodRes] = await Promise.all([
      fetch(`${WORKER_URL}/sheets?tab=Symptoms&from=${from}&to=${to}`),
      fetch(`${WORKER_URL}/sheets?tab=Mood&from=${from}&to=${to}`)
    ]);
    const sympData = await sympRes.json();
    const moodData = await moodRes.json();

    const history = loadHistory();
    // Merge symptom data (worker fills in gaps not yet in localStorage)
    if (sympData.success) {
      for (const [iso, row] of Object.entries(sympData.data)) {
        if (!history.logs[iso] && row.date) {
          // Reconstruct a log entry from the worker row
          const data = {};
          for (const k of SYMPTOM_KEYS_ORDERED) {
            if (row[k]) data[k] = row[k];
          }
          if (Object.keys(data).length > 0) {
            history.logs[iso] = {
              date: row.date, data, severity: worstSeverity(data),
              savedAt: row.date, fromWorker: true
            };
          }
        }
      }
    }
    // Merge mood data
    if (moodData.success) {
      for (const [iso, row] of Object.entries(moodData.data)) {
        if (row.mood && !history.moods[iso]) {
          history.moods[iso] = {
            date: row.date, mood: row.mood, note: row.note || ''
          };
        }
      }
    }
    saveHistory(history);
    return history;
  } catch (e) {
    // Worker unreachable — just use local cache
    return loadHistory();
  }
}

// Render the full report for the given range
function renderReport(history, from, to) {
  const body = document.getElementById('reports-body');
  body.innerHTML = '';

  // Collect all logged days in range
  const days = [];
  let cursor = from;
  while (cursor <= to) {
    days.push(cursor);
    const [y, m, d] = cursor.split('-').map(Number);
    const next = new Date(Date.UTC(y, m - 1, d + 1, 12));
    cursor = isoKey(next);
  }

  const loggedDays = days.filter(iso => history.logs[iso]);
  const total = days.filter(iso => iso <= isoKey(jamaicaNow())).length; // exclude future

  // ── Summary stats ──────────────────────────────────────────────────────────
  const summaryCard = document.createElement('div');
  summaryCard.className = 'report-card';
  summaryCard.innerHTML = '<div class="report-card-title">Summary</div>';
  const grid = document.createElement('div');
  grid.className = 'summary-grid';

  // Days logged
  grid.appendChild(statCell(loggedDays.length + ' / ' + total, 'Days logged',
    Math.round((loggedDays.length / Math.max(total,1)) * 100) + '% of range'));

  // Most common symptom
  const symptomCounts = {};
  for (const iso of loggedDays) {
    const data = history.logs[iso].data;
    for (const k of SYMPTOM_KEYS_ORDERED) {
      if (data[k] && data[k] !== 'no' && data[k] !== 'Normal' && data[k] !== '') {
        symptomCounts[k] = (symptomCounts[k] || 0) + 1;
      }
    }
  }
  const topSymptom = Object.entries(symptomCounts).sort((a,b) => b[1]-a[1])[0];
  grid.appendChild(statCell(
    topSymptom ? SYMPTOM_LABELS_SHORT[topSymptom[0]] : '—',
    'Most common',
    topSymptom ? topSymptom[1] + ' days' : 'no data'
  ));

  // Days with any symptom
  const daysWithSymptom = loggedDays.filter(iso => history.logs[iso].severity !== 'none').length;
  grid.appendChild(statCell(daysWithSymptom + '', 'Days with symptoms',
    Math.round((daysWithSymptom / Math.max(loggedDays.length,1)) * 100) + '% of logged'));

  // Mood logged count
  const moodDays = days.filter(iso => history.moods && history.moods[iso]);
  grid.appendChild(statCell(moodDays.length + '', 'Mood entries',
    moodDays.length > 0 ? 'in range' : 'none yet'));

  summaryCard.appendChild(grid);
  body.appendChild(summaryCard);

  // ── Per-symptom bars ───────────────────────────────────────────────────────
  if (loggedDays.length > 0) {
    const barsCard = document.createElement('div');
    barsCard.className = 'report-card';
    barsCard.innerHTML = '<div class="report-card-title">Symptom breakdown</div>';

    for (const key of SYMPTOM_KEYS_ORDERED) {
      let none = 0, mild = 0, moderate = 0, severe = 0;
      for (const iso of loggedDays) {
        const v = history.logs[iso].data[key] || '';
        if (v === 'Severe')   severe++;
        else if (v === 'Moderate' || v === 'Abnormal') moderate++;
        else if (v === 'Mild') mild++;
        else none++;
      }
      const total_d = loggedDays.length;
      if (total_d === 0) continue;
      const pctMild     = Math.round((mild     / total_d) * 100);
      const pctModerate = Math.round((moderate / total_d) * 100);
      const pctSevere   = Math.round((severe   / total_d) * 100);

      const worstLabel = severe > 0 ? 'Severe' : moderate > 0 ? 'Moderate' : mild > 0 ? 'Mild' : 'None';

      const row = document.createElement('div');
      row.className = 'symptom-bar-row';
      row.innerHTML =
        `<div class="symptom-bar-label">
           <span>${SYMPTOM_LABELS_SHORT[key]}</span>
           <span class="bar-worst">${pctMild + pctModerate + pctSevere > 0 ? 'up to ' + worstLabel : 'None'}</span>
         </div>
         <div class="symptom-bar-track">
           <div class="bar-seg seg-mild"     style="width:${pctMild}%"></div>
           <div class="bar-seg seg-moderate" style="width:${pctModerate}%"></div>
           <div class="bar-seg seg-severe"   style="width:${pctSevere}%"></div>
         </div>`;
      barsCard.appendChild(row);
    }
    body.appendChild(barsCard);
  }

  // ── Heatmap grid ───────────────────────────────────────────────────────────
  const heatCard = document.createElement('div');
  heatCard.className = 'report-card';
  heatCard.innerHTML = '<div class="report-card-title">Day-by-day</div>';

  // Group days by month for the multi-month view
  const byMonth = {};
  for (const iso of days) {
    const [y, m] = iso.split('-');
    const key = y + '-' + m;
    if (!byMonth[key]) byMonth[key] = { y: +y, m: +m, days: [] };
    byMonth[key].days.push(iso);
  }

  const todayIso = isoKey(jamaicaNow());
  for (const [, { y, m, days: mdays }] of Object.entries(byMonth)) {
    const monthDiv = document.createElement('div');
    monthDiv.className = 'report-heatmap-year';
    const label = document.createElement('div');
    label.className = 'report-month-label';
    label.textContent = new Date(Date.UTC(y, m - 1, 1, 12))
      .toLocaleDateString('en-US', { month: 'long' }) + ' ' + y;
    monthDiv.appendChild(label);

    const wdRow = document.createElement('div');
    wdRow.className = 'report-heat-weekdays';
    ['S','M','T','W','T','F','S'].forEach(d => {
      const s = document.createElement('span'); s.textContent = d; wdRow.appendChild(s);
    });
    monthDiv.appendChild(wdRow);

    const gridDiv = document.createElement('div');
    gridDiv.className = 'report-heat-grid';

    const firstOfMonth = new Date(Date.UTC(y, m - 1, 1, 12));
    const offset = firstOfMonth.getUTCDay();
    const totalDays = daysInMonth(y, m);

    for (let i = 0; i < offset; i++) {
      const c = document.createElement('div');
      c.className = 'report-heat-cell rh-empty'; gridDiv.appendChild(c);
    }
    for (let d = 1; d <= totalDays; d++) {
      const iso = isoKeyFromYMD(y, m, d);
      const cell = document.createElement('div');
      cell.className = 'report-heat-cell';
      cell.textContent = d;
      if (iso > todayIso) {
        cell.classList.add('rh-future');
      } else if (iso < from || iso > to) {
        cell.classList.add('rh-empty'); cell.style.opacity = '0.2';
      } else if (history.logs[iso]) {
        const sev = history.logs[iso].severity || 'none';
        cell.classList.add('rh-' + sev);
      } else if (iso <= todayIso) {
        cell.classList.add('rh-unlogged');
      }
      gridDiv.appendChild(cell);
    }
    monthDiv.appendChild(gridDiv);
    heatCard.appendChild(monthDiv);
  }
  body.appendChild(heatCard);

  // ── Mood overlay ───────────────────────────────────────────────────────────
  if (moodDays.length > 0) {
    const moodCard = document.createElement('div');
    moodCard.className = 'report-card';
    moodCard.innerHTML = '<div class="report-card-title">Mood</div>';
    const strip = document.createElement('div');
    strip.className = 'mood-strip';
    for (const iso of moodDays) {
      const entry = history.moods[iso];
      const chip = document.createElement('div');
      chip.className = 'mood-chip';
      const dateLabel = iso.slice(5).replace('-', '/');
      chip.innerHTML = `<span class="mood-date">${dateLabel}</span> ${entry.mood}`;
      if (entry.note) chip.title = entry.note;
      strip.appendChild(chip);
    }
    moodCard.appendChild(strip);
    body.appendChild(moodCard);
  }

  // ── AI insights ────────────────────────────────────────────────────────────
  const insightsCard = document.createElement('div');
  insightsCard.className = 'report-card';
  insightsCard.id = 'insights-card';
  insightsCard.innerHTML = '<div class="report-card-title">Insights</div>';

  const insightsContent = document.createElement('div');
  insightsContent.id = 'insights-content';

  const triggerBtn = document.createElement('button');
  triggerBtn.className = 'insights-trigger';
  triggerBtn.textContent = '✦ Analyse patterns in this range';
  triggerBtn.onclick = () => runInsightsAnalysis(history, from, to, days, loggedDays, moodDays, insightsContent, triggerBtn);

  insightsContent.appendChild(triggerBtn);
  insightsCard.appendChild(insightsContent);
  body.appendChild(insightsCard);
}

// Build a compact plain-text summary of the data to send to Claude
function buildDataSummary(history, from, to, days, loggedDays, moodDays) {
  const lines = [];
  lines.push(`Date range: ${prettyDateFromIso(from)} – ${prettyDateFromIso(to)}`);
  lines.push(`Days in range: ${days.filter(d => d <= isoKey(jamaicaNow())).length} (${loggedDays.length} logged)`);
  lines.push('');

  // Per-symptom breakdown
  lines.push('Symptom frequency (out of ' + loggedDays.length + ' logged days):');
  for (const key of SYMPTOM_KEYS_ORDERED) {
    let mild = 0, moderate = 0, severe = 0;
    for (const iso of loggedDays) {
      const v = history.logs[iso].data[key] || '';
      if (v === 'Severe') severe++;
      else if (v === 'Moderate' || v === 'Abnormal') moderate++;
      else if (v === 'Mild') mild++;
    }
    const anyDays = mild + moderate + severe;
    if (anyDays > 0) {
      const parts = [];
      if (mild)     parts.push(`Mild ${mild}d`);
      if (moderate) parts.push(`Moderate ${moderate}d`);
      if (severe)   parts.push(`Severe ${severe}d`);
      lines.push(`  ${SYMPTOM_LABELS_SHORT[key]}: ${parts.join(', ')} (${anyDays} total days)`);
    }
  }
  lines.push('');

  // Mood distribution
  if (moodDays.length > 0) {
    lines.push('Mood entries (' + moodDays.length + ' days):');
    const moodCounts = {};
    for (const iso of moodDays) {
      const m = history.moods[iso].mood;
      moodCounts[m] = (moodCounts[m] || 0) + 1;
    }
    for (const [mood, count] of Object.entries(moodCounts)) {
      lines.push(`  ${mood}: ${count} days`);
    }
    lines.push('');
  }

  // Severity overview
  const sevCounts = { none: 0, mild: 0, moderate: 0, severe: 0 };
  for (const iso of loggedDays) {
    sevCounts[history.logs[iso].severity || 'none']++;
  }
  lines.push(`Overall severity breakdown:`);
  lines.push(`  Symptom-free: ${sevCounts.none}d, Mild: ${sevCounts.mild}d, Moderate: ${sevCounts.moderate}d, Severe: ${sevCounts.severe}d`);

  return lines.join('\n');
}

async function runInsightsAnalysis(history, from, to, days, loggedDays, moodDays, container, triggerBtn) {
  triggerBtn.disabled = true;
  triggerBtn.textContent = 'Analysing…';

  // Show typing dots while waiting
  const dotsDiv = document.createElement('div');
  dotsDiv.className = 'insights-dots';
  dotsDiv.style.marginTop = '10px';
  dotsDiv.innerHTML = '<span></span><span></span><span></span>';
  container.appendChild(dotsDiv);

  const dataSummary = buildDataSummary(history, from, to, days, loggedDays, moodDays);

  const systemPrompt = `You are a warm, thoughtful health insights assistant helping someone manage endometriosis affecting their digestive system. Your role is to notice patterns in symptom and mood data and offer gentle, practical observations.

Guidelines:
- Use warm, calm language — never alarming or clinical
- Note both what's been difficult AND any positive patterns or improvements
- Identify correlations between symptoms if they appear
- Mention anything that might be worth discussing with a doctor
- Keep it under 280 words, written in short readable paragraphs
- Use **bold** sparingly to highlight the most important observations
- Do not give medical advice or diagnoses`;

  const userPrompt = `Here is the symptom and mood tracking data for the selected date range:\n\n${dataSummary}\n\nPlease analyse any patterns or trends you notice and share what might be most useful to know.`;

  try {
    const res = await fetch(WORKER_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        model: 'claude-haiku-4-5-20251001',
        max_tokens: 500,
        system: systemPrompt,
        messages: [{ role: 'user', content: userPrompt }]
      })
    });
    const data = await res.json();
    dotsDiv.remove();
    triggerBtn.remove();

    if (data.content && data.content[0] && data.content[0].text) {
      const analysisText = data.content[0].text.trim();
      const bodyDiv = document.createElement('div');
      bodyDiv.className = 'insights-body';
      // Render **bold** markdown
      bodyDiv.innerHTML = analysisText
        .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
        .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
        .replace(/\n\n/g, '<br><br>');
      container.appendChild(bodyDiv);

      const meta = document.createElement('div');
      meta.className = 'insights-meta';
      meta.textContent = 'AI-generated observations — not medical advice. Always discuss with your doctor.';
      container.appendChild(meta);
    } else {
      throw new Error(data.error?.message || 'Unexpected response');
    }
  } catch (e) {
    dotsDiv.remove();
    triggerBtn.disabled = false;
    triggerBtn.textContent = '✦ Analyse patterns in this range';
    const errDiv = document.createElement('div');
    errDiv.style.cssText = 'font-size:0.82rem;color:var(--text-muted);margin-top:8px;';
    errDiv.textContent = 'Could not load analysis — please try again.';
    container.appendChild(errDiv);
    setTimeout(() => errDiv.remove(), 4000);
  }
}

function statCell(value, label, sub) {
  const div = document.createElement('div');
  div.className = 'summary-stat';
  div.innerHTML =
    `<div class="summary-stat-label">${label}</div>
     <div class="summary-stat-value">${value}</div>
     <div class="summary-stat-sub">${sub}</div>`;
  return div;
}

// Open / close reports overlay
async function openReports() {
  const overlay = document.getElementById('reports-overlay');
  overlay.classList.add('open');
  window.scrollTo(0, 0);
  await loadReportRange(activeRange);
}

async function loadReportRange(preset) {
  activeRange = preset;
  // Update active button
  document.querySelectorAll('.range-btn').forEach(btn => {
    btn.classList.toggle('active', btn.dataset.range === preset);
  });
  document.getElementById('reports-body').innerHTML = '';
  document.getElementById('reports-loading').style.display = 'block';
  const { from, to } = rangeFromPreset(preset);
  const history = await fetchAndMerge(from, to);
  document.getElementById('reports-loading').style.display = 'none';
  renderReport(history, from, to);
}

document.getElementById('reports-btn').onclick = openReports;
document.getElementById('reports-close-btn').onclick = () => {
  document.getElementById('reports-overlay').classList.remove('open');
};
document.querySelectorAll('.range-btn').forEach(btn => {
  btn.onclick = () => loadReportRange(btn.dataset.range);
});

function init() {
  renderQuote();
  renderStats();
  renderHeatmap();
  maybeShowMissedDay();

  showTyping();
  setTimeout(() => {
    removeTyping();
    const hr = jamaicaNow().getHours();
    const greet = hr < 12 ? 'Good morning' : hr < 17 ? 'Good afternoon' : 'Hey';
    addMsg('assistant', greet + " Let's log how you're feeling today. Just tap your answer for each one.");
    setTimeout(() => askNext(), 500);
  }, 800);
}
init();
