<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Symptom Tracker</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --sage: #4A6652;
    --sage-light: #6a8f72;
    --sage-pale: #e8f0ea;
    --sage-mid: #c5d9c9;
    --cream: #faf8f4;
    --text: #2a2a2a;
    --text-muted: #7a7a7a;
    --white: #ffffff;
    --border: #dde8df;
    --severe: #c0392b;
    --severe-bg: #fdecea;
    --moderate: #e67e22;
    --moderate-bg: #fef3e8;
    --mild: #27ae60;
    --mild-bg: #eafaf1;
    --radius: 18px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

  body {
    font-family: 'Outfit', sans-serif;
    background: var(--cream);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 20px 16px 80px;
  }

  header { text-align: center; margin-bottom: 22px; }

  header h1 {
    font-family: 'Playfair Display', serif;
    font-size: 1.75rem;
    color: var(--sage);
  }

  header p {
    font-size: 0.82rem;
    color: var(--text-muted);
    margin-top: 4px;
    font-weight: 300;
  }

  #chat-wrap {
    width: 100%;
    max-width: 480px;
    display: flex;
    flex-direction: column;
  }

  #progress-bar-wrap {
    width: 100%;
    background: var(--border);
    border-radius: 999px;
    height: 4px;
    margin-bottom: 20px;
    overflow: hidden;
  }

  #progress-bar {
    height: 100%;
    background: var(--sage);
    border-radius: 999px;
    transition: width 0.5s ease;
    width: 0%;
  }

  #messages {
    display: flex;
    flex-direction: column;
    gap: 10px;
    margin-bottom: 16px;
  }

  .msg {
    display: flex;
    gap: 10px;
    align-items: flex-end;
    animation: fadeUp 0.22s ease;
  }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(6px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .msg.assistant { flex-direction: row; }
  .msg.user      { flex-direction: row-reverse; }

  .avatar {
    width: 28px; height: 28px;
    border-radius: 50%;
    background: var(--sage);
    display: flex; align-items: center; justify-content: center;
    font-size: 0.7rem; color: white; flex-shrink: 0;
    font-family: 'Playfair Display', serif; font-style: italic;
  }

  .bubble {
    max-width: 82%;
    padding: 10px 14px;
    border-radius: 16px;
    font-size: 0.9rem;
    line-height: 1.5;
  }

  .msg.assistant .bubble {
    background: var(--white);
    border: 1px solid var(--border);
    border-bottom-left-radius: 4px;
    color: var(--text);
  }

  .msg.user .bubble {
    background: var(--sage);
    color: white;
    border-bottom-right-radius: 4px;
  }

  .bubble.typing span {
    display: inline-block;
    width: 6px; height: 6px;
    background: var(--sage-mid);
    border-radius: 50%;
    animation: blink 1.2s infinite;
    margin: 0 2px;
  }
  .bubble.typing span:nth-child(2) { animation-delay: 0.2s; }
  .bubble.typing span:nth-child(3) { animation-delay: 0.4s; }

  @keyframes blink {
    0%,80%,100% { opacity:0.2; transform:scale(0.8); }
    40%          { opacity:1;   transform:scale(1); }
  }

  #btn-area {
    display: flex;
    flex-direction: column;
    gap: 8px;
    margin-bottom: 8px;
  }

  .btn-row {
    display: flex;
    gap: 8px;
  }

  .choice-btn {
    flex: 1;
    padding: 14px 8px;
    border-radius: 14px;
    border: 2px solid var(--border);
    background: var(--white);
    font-family: 'Outfit', sans-serif;
    font-size: 0.9rem;
    font-weight: 500;
    color: var(--text);
    cursor: pointer;
    transition: all 0.15s ease;
    text-align: center;
    -webkit-appearance: none;
  }

  .choice-btn:active { transform: scale(0.95); }

  .choice-btn.no       { border-color: #ccc; color: #888; }
  .choice-btn.no:active, .choice-btn.no.sel { background: #f0f0f0; border-color: #aaa; }

  .choice-btn.mild     { border-color: var(--mild); color: var(--mild); }
  .choice-btn.mild:active, .choice-btn.mild.sel { background: var(--mild-bg); }

  .choice-btn.moderate { border-color: var(--moderate); color: var(--moderate); }
  .choice-btn.moderate:active, .choice-btn.moderate.sel { background: var(--moderate-bg); }

  .choice-btn.severe   { border-color: var(--severe); color: var(--severe); }
  .choice-btn.severe:active, .choice-btn.severe.sel { background: var(--severe-bg); }

  .choice-btn.normal   { border-color: var(--sage); color: var(--sage); }
  .choice-btn.normal:active, .choice-btn.normal.sel { background: var(--sage-pale); }

  .choice-btn.abnormal { border-color: var(--moderate); color: var(--moderate); }
  .choice-btn.abnormal:active, .choice-btn.abnormal.sel { background: var(--moderate-bg); }

  #summary-card {
    display: none;
    background: var(--white);
    border-radius: var(--radius);
    border: 1px solid var(--border);
    padding: 20px;
    margin-top: 10px;
    box-shadow: 0 2px 16px rgba(74,102,82,0.07);
  }

  #summary-card h2 {
    font-family: 'Playfair Display', serif;
    font-size: 1rem;
    color: var(--sage);
    margin-bottom: 14px;
  }

  .s-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 8px 0;
    border-bottom: 1px solid var(--sage-pale);
    font-size: 0.83rem;
  }
  .s-row:last-child { border-bottom: none; }
  .s-name { color: var(--text-muted); }

  .badge {
    padding: 3px 11px; border-radius: 20px;
    font-size: 0.74rem; font-weight: 600;
  }
  .b-severe   { background: var(--severe-bg);   color: var(--severe); }
  .b-moderate { background: var(--moderate-bg); color: var(--moderate); }
  .b-mild     { background: var(--mild-bg);     color: var(--mild); }
  .b-normal   { background: var(--sage-pale);   color: var(--sage); }
  .b-no       { background: #f0f0f0; color: #999; }

  #done-note {
    display: none;
    margin-top: 12px;
    padding: 12px 16px;
    background: var(--sage-pale);
    border-radius: 12px;
    border: 1px solid var(--sage-mid);
    font-size: 0.82rem;
    color: var(--sage);
    text-align: center;
    font-weight: 500;
  }
</style>
</head>
<body>

<header>
  <h1>How are you feeling?</h1>
  <p id="today-date"></p>
</header>

<div id="chat-wrap">
  <div id="progress-bar-wrap"><div id="progress-bar"></div></div>
  <div id="messages"></div>
  <div id="btn-area"></div>
  <div id="summary-card">
    <h2>Today's Summary</h2>
    <div id="summary-rows"></div>
  </div>
  <div id="done-note">✓ All logged for today 🌿</div>
</div>

<script>
const TODAY = new Date();
const dateStr = TODAY.toLocaleDateString('en-GB', { day: 'numeric', month: 'long', year: 'numeric' });
document.getElementById('today-date').textContent = dateStr;

const SYMPTOMS = [
  { key: 'migraine',          label: 'Migraine',             type: 'severity' },
  { key: 'fatigue',           label: 'Fatigue',              type: 'severity' },
  { key: 'pelvicPain',        label: 'Pelvic Pain',          type: 'severity' },
  { key: 'backPain',          label: 'Back Pain',            type: 'severity' },
  { key: 'nausea',            label: 'Nausea',               type: 'severity' },
  { key: 'nervePain',         label: 'Nerve Pain',           type: 'severity' },
  { key: 'abdomenDiscomfort', label: 'Abdomen Discomfort',   type: 'severity' },
  { key: 'neckShoulderPain',  label: 'Neck & Shoulder Pain', type: 'severity' },
  { key: 'constipation',      label: 'Constipation',         type: 'severity' },
  { key: 'insomnia',          label: 'Insomnia',             type: 'severity' },
  { key: 'appetite',          label: 'Appetite',             type: 'appetite' },
];

const QUESTIONS = {
  migraine:          "Any headaches or migraines today?",
  fatigue:           "How are your energy levels? Feeling fatigued?",
  pelvicPain:        "Any pelvic pain or discomfort?",
  backPain:          "How's your back feeling?",
  nausea:            "Any nausea today?",
  nervePain:         "Any nerve pain?",
  abdomenDiscomfort: "Any abdominal discomfort?",
  neckShoulderPain:  "Any neck or shoulder tension?",
  constipation:      "Any constipation?",
  insomnia:          "How did you sleep last night?",
  appetite:          "How's your appetite today?",
};

const LABELS = {
  migraine: 'Migraine', nausea: 'Nausea', pelvicPain: 'Pelvic Pain',
  backPain: 'Back Pain', constipation: 'Constipation', fatigue: 'Fatigue',
  nervePain: 'Nerve Pain', insomnia: 'Insomnia', abdomenDiscomfort: 'Abdomen Discomfort',
  neckShoulderPain: 'Neck & Shoulder Pain', appetite: 'Appetite'
};

let collected = {};
let currentIdx = 0;
let busy = false;

const messagesEl  = document.getElementById('messages');
const btnArea     = document.getElementById('btn-area');
const progressBar = document.getElementById('progress-bar');

function setProgress(idx) {
  progressBar.style.width = Math.round((idx / SYMPTOMS.length) * 100) + '%';
}

function scrollBottom() {
  setTimeout(() => window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' }), 50);
}

function addMsg(role, text) {
  const d = document.createElement('div');
  d.className = 'msg ' + role;
  d.innerHTML = role === 'assistant'
    ? `<div class="avatar">S</div><div class="bubble">${text}</div>`
    : `<div class="bubble">${text}</div>`;
  messagesEl.appendChild(d);
  scrollBottom();
}

function showTyping() {
  const d = document.createElement('div');
  d.className = 'msg assistant'; d.id = 'typing';
  d.innerHTML = `<div class="avatar">S</div><div class="bubble typing"><span></span><span></span><span></span></div>`;
  messagesEl.appendChild(d);
  scrollBottom();
}

function removeTyping() {
  const t = document.getElementById('typing');
  if (t) t.remove();
}

function clearBtns() { btnArea.innerHTML = ''; }

function showButtons(symptomKey) {
  clearBtns();
  const row = document.createElement('div');
  row.className = 'btn-row';

  const opts = symptomKey === 'appetite'
    ? [{ l: 'Normal', c: 'normal', v: 'Normal' }, { l: 'Abnormal', c: 'abnormal', v: 'Abnormal' }]
    : [
        { l: 'No',       c: 'no',       v: 'no' },
        { l: 'Mild',     c: 'mild',     v: 'Mild' },
        { l: 'Moderate', c: 'moderate', v: 'Moderate' },
        { l: 'Severe',   c: 'severe',   v: 'Severe' },
      ];

  opts.forEach(opt => {
    const btn = document.createElement('button');
    btn.className = 'choice-btn ' + opt.c;
    btn.textContent = opt.l;
    btn.onclick = () => pick(symptomKey, opt.v, opt.l);
    row.appendChild(btn);
  });

  btnArea.appendChild(row);
  scrollBottom();
}

function pick(key, value, label) {
  if (busy) return;
  busy = true;
  collected[key] = value;
  addMsg('user', label);
  clearBtns();
  currentIdx++;
  setProgress(currentIdx);
  setTimeout(() => {
    if (currentIdx < SYMPTOMS.length) {
      askNext();
    } else {
      wrapUp();
    }
    busy = false;
  }, 350);
}

function askNext() {
  const s = SYMPTOMS[currentIdx];
  showTyping();
  setTimeout(() => {
    removeTyping();
    addMsg('assistant', QUESTIONS[s.key]);
    showButtons(s.key);
  }, 550);
}

function wrapUp() {
  showTyping();
  setTimeout(() => {
    removeTyping();
    const issues = Object.entries(collected).filter(([k,v]) => v !== 'no' && v !== 'Normal');
    const msg = issues.length === 0
      ? "Sounds like a good day! All logged. 🌿"
      : `Got it — I've noted ${issues.map(([k]) => LABELS[k]).join(', ')}. Take care of yourself today. 💚`;
    addMsg('assistant', msg);
    showSummary();
    setProgress(SYMPTOMS.length);
  }, 650);
}

function showSummary() {
  const card = document.getElementById('summary-card');
  const rows = document.getElementById('summary-rows');
  rows.innerHTML = '';
  for (const [key, val] of Object.entries(collected)) {
    const row = document.createElement('div');
    row.className = 's-row';
    const bc = val === 'Severe' ? 'b-severe' : val === 'Moderate' ? 'b-moderate'
             : val === 'Mild' ? 'b-mild' : val === 'Normal' ? 'b-normal' : 'b-no';
    row.innerHTML = `<span class="s-name">${LABELS[key]}</span><span class="badge ${bc}">${val}</span>`;
    rows.appendChild(row);
  }
  card.style.display = 'block';
  document.getElementById('done-note').style.display = 'block';
  setTimeout(() => window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' }), 100);
}

// Start
function init() {
  showTyping();
  setTimeout(() => {
    removeTyping();
    const hr = new Date().getHours();
    const greet = hr < 12 ? 'Good morning' : hr < 17 ? 'Good afternoon' : 'Hey';
    addMsg('assistant', `${greet} 🌿 Let's log how you're feeling today. Just tap your answer for each one.`);
    setTimeout(() => askNext(), 500);
  }, 800);
}

init();
</script>
</body>
</html>
